6CC\u062F \u0645\u0648\u0633\u0645 \u06A9\u06CC \u0648\u0627\u0631\u0646\u0646\u06AF\u06D4 \u0688\u06CC\u0644\u06CC\u0648\u0631\u06CC \u0631\u0648\u06A9 \u062F\u06CC\u06BA\u060C \u0645\u062D\u0641\u0648\u0638 \u062C\u06AF\u06C1 \u067E\u0631 \u067E\u0646\u0627\u06C1 \u0644\u06CC\u06BA \u0627\u0648\u0631 \u062F\u0648\u0628\u0627\u0631\u06C1 \u0634\u0631\u0648\u0639 \u06A9\u0631\u0646\u06D2 \u06A9\u06CC \u0627\u062C\u0627\u0632\u062A \u06A9\u0627 \u0627\u0646\u062A\u0638\u0627\u0631 \u06A9\u0631\u06CC\u06BA\u06D4",tr:"\u015Eiddetli hava uyar\u0131s\u0131. Teslimatlar\u0131 durdurun, g\xFCvenli bir yere s\u0131\u011F\u0131n\u0131n ve merkezden onay bekleyin.",pl:"Ostrze\u017Cenie o gwa\u0142townej pogodzie. Wstrzymaj dostawy, znajd\u017A bezpieczne schronienie i czekaj na sygna\u0142 do wznowienia."}},{id:"tpl-break-arbzg",kind:"safety",title:"Break reminder (ArbZG)",mustAcknowledge:!0,bodies:{de:"Nach 6 Stunden Arbeit ist eine Pause von 30 Minuten Pflicht (ArbZG \xA74). Bitte jetzt einlegen.",en:"By law (ArbZG \xA74) you must take a 30 minute break after 6 hours of work. Please take it now.",ar:"\u0628\u0645\u0648\u062C\u0628 \u0642\u0627\u0646\u0648\u0646 \u0627\u0644\u0639\u0645\u0644 \u0627\u0644\u0623\u0644\u0645\u0627\u0646\u064A\u060C \u0627\u0644\u0627\u0633\u062A\u0631\u0627\u062D\u0629 30 \u062F\u0642\u064A\u0642\u0629 \u0625\u0644\u0632\u0627\u0645\u064A\u0629 \u0628\u0639\u062F 6 \u0633\u0627\u0639\u0627\u062A \u0639\u0645\u0644. \u064A\u0631\u062C\u0649 \u0623\u062E\u0630\u0647\u0627 \u0627\u0644\u0622\u0646.",ur:"\u062C\u0631\u0645\u0646 \u0644\u06CC\u0628\u0631 \u0644\u0627 \u06A9\u06D2 \u062A\u062D\u062A 6 \u06AF\u06BE\u0646\u0679\u06D2 \u06A9\u0627\u0645 \u06A9\u06D2 \u0628\u0639\u062F 30 \u0645\u0646\u0679 \u06A9\u0627 \u0648\u0642\u0641\u06C1 \u0644\u0627\u0632\u0645\u06CC \u06C1\u06D2\u06D4 \u0628\u0631\u0627\u06C1 \u06A9\u0631\u0645 \u0627\u0628\u06BE\u06CC \u0648\u0642\u0641\u06C1 \u0644\u06CC\u06BA\u06D4",tr:"Alman i\u015F kanununa g\xF6re 6 saat
